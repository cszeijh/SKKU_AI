<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손으로 하는 공룡 게임</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #2b3036;
    --sub: #667079;
    --line: #d5dbe1;
    --accent: #0e8f7e;
    --warn: #c2410c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
  .home { display: inline-block; margin: 0 0 8px; font-size: .85rem; color: var(--sub); text-decoration: none; }
  .home:hover { color: var(--ink); text-decoration: underline; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { margin: 0 0 16px; color: var(--sub); }

  .stage {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 8px;
  }
  #game { display: block; width: 100%; height: auto; image-rendering: pixelated; }

  .panel {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    margin-top: 16px;
    align-items: start;
  }
  .cam {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #1d2227;
    border-radius: 6px;
    overflow: hidden;
  }
  .cam video, .cam canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .cam .empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #9aa5ae; font-size: .9rem; text-align: center; padding: 12px;
  }
  .ctrl { display: flex; flex-direction: column; gap: 12px; }
  button {
    font: inherit; font-weight: 700;
    padding: 10px 16px;
    border: 2px solid var(--ink);
    background: var(--ink); color: #fff;
    border-radius: 6px; cursor: pointer;
    align-self: flex-start;
  }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .readout {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    font-size: 1rem;
  }
  .readout dt { color: var(--sub); }
  .readout dd { margin: 0; font-weight: 700; }
  #act.jump { color: var(--accent); }
  #act.duck { color: var(--warn); }

  label.thr { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; color: var(--sub); }
  label.thr input { width: 100%; }
  .help { margin: 0; padding-left: 1.1em; color: var(--sub); font-size: .9rem; }
  #msg { min-height: 1.4em; color: var(--warn); font-size: .9rem; margin: 0; }

  @media (max-width: 700px) {
    .panel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <a class="home" href="index.html">← 목차</a>
  <h1>손으로 하는 공룡 게임</h1>
  <p class="sub">손 하나를 올리면 점프, 두 손을 올리면 숙이기. 키보드(스페이스, 위, 아래)로도 할 수 있음.</p>

  <div class="stage">
    <canvas id="game" width="800" height="240"></canvas>
  </div>

  <div class="panel">
    <div class="cam">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="empty" id="camEmpty">카메라 시작 버튼을 누르면 여기에 화면이 나옴</div>
    </div>

    <div class="ctrl">
      <button id="startBtn" type="button">카메라 시작</button>
      <p id="msg" role="status"></p>

      <dl class="readout">
        <dt>올린 손</dt><dd id="cnt">0개</dd>
        <dt>동작</dt><dd id="act">달리기</dd>
      </dl>

      <label class="thr">
        손 올림 기준선 (화면 위쪽에서 몇 % 아래까지 올라와야 하는지)
        <input id="thr" type="range" min="30" max="90" value="65">
      </label>

      <ul class="help">
        <li>손바닥을 카메라 쪽으로 펴고, 손가락이 위를 향하게 올림.</li>
        <li>카메라 화면의 가로선보다 손목이 위에 있으면 올린 것으로 판정.</li>
        <li>게임 시작과 재시작도 손 하나 올리기 또는 스페이스.</li>
      </ul>
    </div>
  </div>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------------------------------------------------------------
   게임
---------------------------------------------------------------- */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height, GROUND = 200;
const COLOR = "#535353";

const dino = { x: 50, y: 0, vy: 0, duck: false, run: 0 };
const STAND = { w: 44, h: 44 }, DUCK = { w: 56, h: 28 };

/* 도트 스프라이트 (# = 몸, e = 눈). 한 칸을 2px로 확대해서 그림 */
const SPR_DATA = {
 "stand": [

  "............##########",
  "............###e######",
  "............##########",
  "............##########",
  "............##########",
  "............######....",
  "............#####.....",
  "##.........########...",
  "###......###########..",
  ".####...############..",
  "..####################",
  "...#################..",

  ".......#########......",
  ".........##...##......",
  ".........##...##......",

  ".........####.####...."
 ],
 "run1": [

 ],

  ".........##...........",
  ".........####........."
 ],

  "..................##########",
  "..................##########",

  "..................##########",

  "#######################.....",
  ".#######################....",

 ],
 "duck2": [
  "..................##########",
  "..................##########",
  "..................###e######",
  "..................##########",
  "..................##########",
  "#######################.....",
  ".#######################....",
  "...#####################....",
  ".....##################.....",
  "......################......",
  "........############........",
  "..........##.....####.......",
  "..........##................",
  "..........####.............."
 ],
 "cactus_s": [
  ".....#.....",
  "....###....",
  "....###....",

  "##..###..##",

 ],
 "cactus_l": [
  "......###......",

  ".....#####...##",

 ],

  "...................###..",
  ".................####...",
  "...............#####....",
  ".............######.....",
  ".........#########......",
  ".....#############......",
  "######e#############....",
  "...###################..",
  "..........##############",
  "........................",

 ],
 "bird2": [
  "........................",
  "........................",
  "........................",
  "........................",
  ".........##.............",
  ".....######.............",
  "######e#############....",
  "...###################..",
  "..........##############",
  "...........###########..",
  ".............#########..",
  "...............######...",
  ".................####...",
  "...................###.."
 ]
};
function makeSprite(rows, scale = 2) {
  const c = document.createElement("canvas");
  c.width = rows[0].length * scale; c.height = rows.length * scale;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "#") { g.fillStyle = COLOR; g.fillRect(x * scale, y * scale, scale, scale); }
    else if (ch === "e") { g.fillStyle = "#fff"; g.fillRect(x * scale, y * scale, scale, scale); }
  }));
  return c;
}
const SPR = {};
for (const k in SPR_DATA) SPR[k] = makeSprite(SPR_DATA[k]);


let mode = "ready";            // ready, running, over
let score = 0, hi = 0, speed = 6;
let obstacles = [], clouds = [], gapLeft = 400, groundOffset = 0, frameCount = 0;
let overAt = 0;

try { hi = parseInt(localStorage.getItem("dinoHi") || "0", 10) || 0; } catch (e) {}

for (let i = 0; i < 3; i++) clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 60 });

function resetGame() {
  dino.y = 0; dino.vy = 0; dino.duck = false;
  obstacles = []; score = 0; speed = 6; gapLeft = 400;
  mode = "running";
}

function jump() {
  if (mode === "ready") { resetGame(); }
  else if (mode === "over") {
    if (performance.now() - overAt > 500) resetGame();
    return;
  }
  if (dino.y === 0 && !dino.duck) dino.vy = 12;
}

let keyDuck = false, handDuck = false;

function spawn() {
  const birdOk = score > 250;
  if (birdOk && Math.random() < 0.35) {
    obstacles.push({ type: "bird", x: W + 20, y: 22, w: 48, h: 28,
                     hit: { dx: 4, dy: 10, w: 40, h: 18 } });
  } else {
    const big = Math.random() < 0.5;
    const spr = big ? SPR.cactus_l : SPR.cactus_s;
    const n = 1 + Math.floor(Math.random() * 3);
    const w = n * spr.width + (n - 1) * 4;
    obstacles.push({ type: "cactus", big, n, x: W + 20, y: 0, w, h: spr.height,
                     hit: { dx: 4, dy: 0, w: w - 8, h: spr.height - 4 } });
  }
  gapLeft = 280 + Math.random() * 320 + speed * 18;
}

function hitbox() {
  if (dino.duck) return { x: dino.x + 8, y: dino.y, w: 44, h: 24 };
  return { x: dino.x + 12, y: dino.y, w: 28, h: 40 };
}

function collide(o) {
  const d = hitbox();
  const ox = o.x + o.hit.dx, oy = o.y + o.hit.dy, ow = o.hit.w, oh = o.hit.h;
  return d.x < ox + ow && d.x + d.w > ox && d.y < oy + oh && d.y + d.h > oy;
}

function update(step) {
  dino.duck = (keyDuck || handDuck);
  if (mode !== "running") return;

  // 점프 물리
  const g = (dino.duck && dino.y > 0) ? 1.6 : 0.6;
  if (dino.y > 0 || dino.vy > 0) {
    dino.y += dino.vy * step;
    dino.vy -= g * step;
    if (dino.y <= 0) { dino.y = 0; dino.vy = 0; }
  }
  // 공중에서는 숙이기 판정을 쓰지 않음 (빠른 낙하만 적용)
  if (dino.y > 0) dino.duck = false;

  score += speed * step * 0.05;
  speed = Math.min(15, 6 + score / 150);
  dino.run += step * (speed / 6);

  gapLeft -= speed * step;
  if (gapLeft <= 0) spawn();

  for (const o of obstacles) o.x -= speed * step;
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  for (const o of obstacles) {
    if (collide(o)) {
      mode = "over"; overAt = performance.now();
      const sc = Math.floor(score);
      if (sc > hi) { hi = sc; try { localStorage.setItem("dinoHi", String(hi)); } catch (e) {} }
      break;
    }
  }

  groundOffset = (groundOffset + speed * step) % 40;
  for (const c of clouds) { c.x -= step * 0.5; if (c.x < -60) { c.x = W + 20; c.y = 20 + Math.random() * 60; } }
}

function drawDino() {
  const bottom = GROUND - dino.y;
  const onGround = dino.y === 0 && mode === "running";
  const alt = Math.floor(dino.run / 6) % 2 === 0;
  let s;
  if (dino.duck) s = onGround && !alt ? SPR.duck2 : SPR.duck1;
  else if (onGround) s = alt ? SPR.run1 : SPR.run2;
  else s = SPR.stand;
  ctx.drawImage(s, dino.x, bottom - s.height);
}

function drawObstacle(o) {
  const bottom = GROUND - o.y;
  if (o.type === "cactus") {
    const s = o.big ? SPR.cactus_l : SPR.cactus_s;
    for (let i = 0; i < o.n; i++) ctx.drawImage(s, o.x + i * (s.width + 4), bottom - s.height);
  } else {
    const s = Math.floor(frameCount / 10) % 2 === 0 ? SPR.bird1 : SPR.bird2;
    ctx.drawImage(s, o.x, bottom - s.height);
  }
}

function drawCloud(c) {
  ctx.fillStyle = "#e3e3e3";
  ctx.fillRect(c.x, c.y + 6, 46, 8);
  ctx.fillRect(c.x + 8, c.y, 24, 8);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  clouds.forEach(drawCloud);

  ctx.fillStyle = COLOR;
  ctx.fillRect(0, GROUND, W, 2);
  for (let x = -groundOffset; x < W; x += 40) ctx.fillRect(x + 12, GROUND + 8, 10, 2);

  obstacles.forEach(drawObstacle);
  drawDino();

  ctx.fillStyle = COLOR;
  ctx.font = "bold 16px monospace";
  ctx.textAlign = "right";
  ctx.fillText("HI " + String(hi).padStart(5, "0") + "  " + String(Math.floor(score)).padStart(5, "0"), W - 16, 28);

  ctx.textAlign = "center";
  ctx.font = "bold 20px sans-serif";
  if (mode === "ready") {
    ctx.fillText("손 하나를 올리거나 스페이스를 누르면 시작", W / 2, 100);
  } else if (mode === "over") {
    ctx.fillText("GAME OVER", W / 2, 90);
    ctx.font = "16px sans-serif";
    ctx.fillText("손 하나를 올리거나 스페이스를 누르면 다시 시작", W / 2, 120);
  }
}

let last = performance.now();
function loop(now) {
  const step = Math.min(3, (now - last) / 16.667);
  last = now; frameCount++;
  update(step);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 키보드 (카메라 없이 테스트용) */
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); }
  if (e.code === "ArrowDown") { e.preventDefault(); keyDuck = true; }
});
addEventListener("keyup", e => {
  if (e.code === "ArrowDown") keyDuck = false;
});

/* ---------------------------------------------------------------
   손 인식
---------------------------------------------------------------- */
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const octx = overlay.getContext("2d");
const startBtn = document.getElementById("startBtn");
const msg = document.getElementById("msg");
const cntEl = document.getElementById("cnt");
const actEl = document.getElementById("act");
const thrEl = document.getElementById("thr");
const camEmpty = document.getElementById("camEmpty");

let landmarker = null;
let running = false;
let lastVideoTime = -1;

// 손 하나가 "올라간" 상태인지 판정
function isRaised(lm) {
  const thr = thrEl.value / 100;
  const wristUp = lm[0].y < thr;               // 손목이 기준선보다 위
  const fingersUp = lm[12].y < lm[9].y;        // 중지 끝이 중지 뿌리보다 위 (손가락이 위를 향함)
  return wristUp && fingersUp;
}

// 안정화: 같은 값이 몇 프레임 연속될 때만 인정
let cand = 0, candFrames = 0, committed = 0;
function feedCount(n) {
  if (n === cand) candFrames++; else { cand = n; candFrames = 1; }
  const need = n === 1 ? 4 : 3;
  if (candFrames >= need && cand !== committed) {
    const prev = committed;
    committed = cand;
    handDuck = (committed === 2);
    if (committed === 1 && prev === 0) jump();   // 0개에서 1개로 바뀔 때만 점프
  }
}

function updateReadout() {
  cntEl.textContent = committed + "개";
  let label = "달리기", cls = "";
  if (mode === "running") {
    if (dino.y > 0) { label = "점프"; cls = "jump"; }
    else if (dino.duck) { label = "숙이기"; cls = "duck"; }
  }
  actEl.textContent = label; actEl.className = cls;
}

function drawOverlay(hands, raisedFlags) {
  const w = overlay.width, h = overlay.height;
  octx.clearRect(0, 0, w, h);

  // 기준선
  const y = (thrEl.value / 100) * h;
  octx.strokeStyle = "rgba(255,255,255,.8)";
  octx.lineWidth = 2;
  octx.setLineDash([8, 6]);
  octx.beginPath(); octx.moveTo(0, y); octx.lineTo(w, y); octx.stroke();
  octx.setLineDash([]);

  hands.forEach((lm, i) => {
    const color = raisedFlags[i] ? "#2ee6c5" : "#9aa5ae";
    octx.strokeStyle = color; octx.fillStyle = color; octx.lineWidth = 3;
    if (HandLandmarker.HAND_CONNECTIONS) {
      for (const c of HandLandmarker.HAND_CONNECTIONS) {
        octx.beginPath();
        octx.moveTo(lm[c.start].x * w, lm[c.start].y * h);
        octx.lineTo(lm[c.end].x * w, lm[c.end].y * h);
        octx.stroke();
      }
    }
    for (const p of lm) { octx.beginPath(); octx.arc(p.x * w, p.y * h, 4, 0, Math.PI * 2); octx.fill(); }
  });
}

function detectLoop() {
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const hands = res.landmarks || [];
    const flags = hands.map(isRaised);
    let n = flags.filter(Boolean).length;

    // 같은 손이 두 번 잡힌 경우 방지
    if (n === 2) {
      const a = hands[flags.indexOf(true)][0];
      const b = hands[flags.lastIndexOf(true)][0];
      if (Math.abs(a.x - b.x) < 0.08 && Math.abs(a.y - b.y) < 0.08) n = 1;
    }
    feedCount(n);
    drawOverlay(hands, flags);
  }
  updateReadout();
  requestAnimationFrame(detectLoop);
}

async function createLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath, delegate },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.5,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  try {
    return await HandLandmarker.createFromOptions(fileset, opts("GPU"));
  } catch (e) {
    return await HandLandmarker.createFromOptions(fileset, opts("CPU"));
  }
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  msg.textContent = "모델을 불러오는 중...";
  try {
    if (!landmarker) landmarker = await createLandmarker();
    msg.textContent = "카메라를 켜는 중...";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: "user" }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    overlay.width = video.videoWidth || 640;
    overlay.height = video.videoHeight || 480;
    camEmpty.style.display = "none";
    msg.textContent = "";
    startBtn.textContent = "카메라 켜짐";
    running = true;
    detectLoop();
  } catch (err) {
    console.error(err);
    startBtn.disabled = false;
    if (err && err.name === "NotAllowedError") {
      msg.textContent = "카메라 권한이 거부됨. 주소창 왼쪽의 권한 설정에서 허용해야 함.";
    } else if (err && err.name === "NotFoundError") {
      msg.textContent = "카메라를 찾을 수 없음.";
    } else {
      msg.textContent = "불러오기 실패. 인터넷 연결(cdn.jsdelivr.net, storage.googleapis.com 접속)을 확인할 것.";
    }
  }
});
</script>
</body>
</html>
